server:
  port: 8888
cors:
  originPatterns: http://localhost:8080, http://localhost:3000

spring:
  application:
    name: rest-spring-boot-with-java
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
    show-sql: false
    open-in-view: false
logging:
  level:
    root: INFO
spring-doc:
  paths-to-match: "/api/**/V1/**"
  swagger-ui:
    use-root-path: true
