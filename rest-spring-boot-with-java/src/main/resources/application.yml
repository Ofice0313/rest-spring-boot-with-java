spring:
  application:
    name: rest-spring-boot-with-java

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/rest_spring_boot?useSSL=false&useTimezone=true&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: "@Marce1234"

  jpa:
    hibernate:
      ddl-auto: update  # update => ou 'create', 'validate', 'none'
    show-sql: true      # Para ver SQL no console
    properties:
      hibernate:
        # dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true  # Formata o SQL para melhor leitura
    open-in-view: false

  # Configuração do Flyway
#  flyway:
#    enabled: true
#    locations: classpath:db/migration
#    baseline-on-migrate: true
#    baseline-version: 1
#    validate-on-migrate: true
#    # Se quiser limpar e recriar (APENAS DESENVOLVIMENTO):
#    # clean-disabled: false
#    schemas: rest_spring_boot

# Configurações adicionais úteis
logging:
  level:
    root: WARN
