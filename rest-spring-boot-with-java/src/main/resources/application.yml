spring:
  application:
    name: rest-spring-boot-with-java


  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/rest_spring_boot?useSSL=false&useTimezone=true&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: springstudent
    password: "springstudent"

  jpa:
    hibernate:
      ddl-auto: none #update  # update => ou 'create', 'validate', 'none'
    show-sql: true      # Para ver SQL no console
    properties:
      hibernate:
        # dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true  # Formata o SQL para melhor leitura
    open-in-view: false

  jackson:
    serialization:
      indent-output: true
